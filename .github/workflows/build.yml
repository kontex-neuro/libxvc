name: build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os_arch: [
            { os: macos-15, arch: arm64 },
            # { os: macos-15, arch: x64 },
          ]

    runs-on: ${{ matrix.os_arch.os }}

    env:
      OS_ARCH: ${{ matrix.os_arch.os }}-${{ matrix.os_arch.arch }}

    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: pip install cmake conan ninja

      - name: Conan setup
        run: conan config install .github/conan_profiles/${{ env.OS_ARCH }} -tf profiles

      - name: Install gstreamer
        env:
          space_name: ${{ secrets.SPACE_NAME }}
          space_region: ${{ secrets.SPACE_REGION }}
        run: |
          curl -o gstreamer-1.26.tar.gz \
            https://$space_name.$space_region.digitaloceanspaces.com/gstreamer/gstreamer-1.26.tar.gz
          mkdir -p ${{ runner.temp }}/gstreamer
          tar -xzvf gstreamer-1.26.tar.gz -C ${{ runner.temp }}/gstreamer

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }} # xdaqmetadata

      - name: Clone xdaqmetadata
        run: git clone git@github.com:kontex-neuro/xdaqmetadata.git

      - name: Install xdaqmetadata
        working-directory: xdaqmetadata
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/gstreamer/lib/pkgconfig
        run: |
          conan install . -b missing -pr:a ${{ env.OS_ARCH }} -s build_type=Release
          cmake -S . -B build/Release --preset conan-release -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Release
          conan export-pkg . -pr:a ${{ env.OS_ARCH }} -s build_type=Release

      - name: Cache conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ env.OS_ARCH }}-conan
          restore-keys: |
            ${{ env.OS_ARCH }}-conan

      - name: Build
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/gstreamer/lib/pkgconfig
        run: |
          conan install . -b missing -pr:a ${{ env.OS_ARCH }} -s build_type=Release
          cmake -S . -B build/Release --preset conan-release -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Release
